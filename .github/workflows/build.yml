name: Build Firmware (bread-compact-wifi-lcd 240x240)

on:
  push:
    branches:
      - main
  # 允许在 GitHub 网页上手动点「Run workflow」触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with ESP-IDF (esp32s3)
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: release-v5.4
          target: esp32s3
          command: |
            idf.py build
            idf.py merge-bin
            mv build/merged-binary.bin build/bread-compact-wifi-lcd-240x240.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bread-compact-wifi-lcd-240x240
          path: build/bread-compact-wifi-lcd-240x240.bin
          if-no-files-found: error
